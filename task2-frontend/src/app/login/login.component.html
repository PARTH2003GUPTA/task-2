<div class="parent-container">
  <div class="login-container">
    <mat-card class="login-card">
      <mat-card-title class="login-title">Login</mat-card-title>
      <mat-form-field class="form-field">
        <mat-label>Enter username</mat-label>
        <input matInput placeholder="username"[(ngModel)]="username"  required />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Enter your password</mat-label>
        <input matInput [type]="hide ? 'password' : 'text'" placeholder="password" [(ngModel)]="password">
        <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide" type="button" >
          <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
      </mat-form-field>
      <button mat-stroked-button color="primary" class="login-button" [disabled]="!username || !password" (click)="login()">Login</button>
    </mat-card>
  </div>
</div>
